trigger:
- main

pool:
  name: Default

stages:
- stage: TerraformInit
  jobs:
  - job: Init
    steps:
    - pwsh: terraform init
      displayName: Terraform Init

- stage: TerraformPlan
  jobs:
  - job: Plan
    steps:
    - script: terraform plan
    shell : pwsh
      displayName: Terraform Plan
