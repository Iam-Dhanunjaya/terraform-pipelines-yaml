trigger:
- main

pool:
  name: Default

stages:
- stage: TerraformInit
  jobs:
  - job: Init
    steps:
    - pwsh: |
        terraform version
        terraform init
      displayName: Terraform Init

- stage: TerraformPlan
  jobs:
  - job: Plan
    steps:
    - pwsh: |
        terraform plan
      displayName: Terraform Plan
